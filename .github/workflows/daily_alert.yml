name: Daily Medicine Alert

on:
  schedule:
    # 08:00 AM IST = 02:30 UTC
    # IST is UTC+5:30, so 08:00 IST = 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:   # lets you trigger it manually from GitHub too

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic openpyxl

      - name: Create email config from secrets
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'EOF'
          import json, os
          config = {
              "enabled": True,
              "smtp_server": "smtp.gmail.com",
              "smtp_port": 465,
              "sender_email": os.environ["GMAIL_EMAIL"],
              "app_password": os.environ["GMAIL_APP_PASSWORD"],
              "receiver_email": os.environ["GMAIL_EMAIL"]
          }
          with open("medicine_tracker_app/email_config.json", "w") as f:
              json.dump(config, f, indent=4)
          EOF

      - name: Send daily medicine alert
        run: python CLAUDE/daily_alert.py
